# Quarto FH-SWF Theme - Project Configuration
project:
  type: default
  output-dir: _site

# Brand configuration
brand: _brand.yml

# Format defaults
format:
  html:
    theme: [brand, styles/fhswf-html.scss]
    toc: true
    toc-title: "Inhalt"
  
  revealjs:
    theme: [brand, styles/fhswf-revealjs.scss]
    slide-number: true
    footer: "{{< brand color primary >}} • FH Südwestfalen"
    logo: medium
    template-partials:
      - templates/title-slide.html

  typst:
    theme: [brand, styles/fhswf-pdf.scss]
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    logo:
      image: assets/logos/fhswf-logo.svg
      width: 25%
      location: left-top
      padding-left: 0.5cm
      padding-top: 0.5cm

# Common metadata
metadata:
  author: "FH Südwestfalen"
  institution: "Fachhochschule Südwestfalen – University of Applied Sciences"
  lang: "de"
  date: today