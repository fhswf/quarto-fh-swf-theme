name: PDF Generation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-documents:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/install-quarto@v2
        with:
          version: '1.6.0'

      - name: Verify Quarto installation
        run: quarto --version

      - name: Cache Quarto packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/_quarto.yml') }}
          restore-keys: |
            ${{ runner.os }}-quarto-

      - name: Render documents to PDF
        run: |
          for doc in examples/document*.qmd; do
            if [ -f "$doc" ]; then
              echo "Rendering $doc to PDF..."
              quarto render "$doc" --to typst && echo "Success: $doc" || echo "Failed: $doc"
            fi
          done

      - name: Upload document PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-pdfs
          path: |
            examples/*.pdf
            !examples/slides*.pdf
          retention-days: 30

      - name: List generated document PDFs
        run: |
          echo "Generated document PDFs:"
          find examples -name "*.pdf" ! -name "*slides*.pdf" -type f 2>/dev/null

  render-slides:
    runs-on: ubuntu-latest
    needs: []  # Can run in parallel with documents
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/install-quarto@v2
        with:
          version: '1.6.0'

      - name: Verify Quarto installation
        run: quarto --version

      - name: Cache Quarto packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/_quarto.yml') }}
          restore-keys: |
            ${{ runner.os }}-quarto-

      - name: Render slides to PDF
        run: |
          for doc in examples/slides*.qmd; do
            if [ -f "$doc" ]; then
              echo "Rendering $doc to PDF..."
              quarto render "$doc" --to typst && echo "Success: $doc" || echo "Failed: $doc"
            fi
          done

      - name: Upload slides PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slides-pdfs
          path: |
            examples/slides*.pdf
          retention-days: 30

      - name: List generated slides PDFs
        run: |
          echo "Generated slides PDFs:"
          find examples -name "*slides*.pdf" -type f 2>/dev/null

  collect-artifacts:
    runs-on: ubuntu-latest
    needs: [render-documents, render-slides]
    
    steps:
      - name: Download all PDFs
        uses: actions/download-artifact@v4
        with:
          path: all-pdfs
          pattern: |
            *-pdfs
          merge-multiple: true

      - name: Display artifacts
        run: |
          echo "All generated PDFs:"
          find all-pdfs -name "*.pdf" -type f
