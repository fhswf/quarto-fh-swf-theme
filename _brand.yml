# FH-SWF (Fachhochschule Südwestfalen) Corporate Design
# Version: 1.0.0
# Based on CD-Handbuch_der_FH_SWF.pdf (August 2014)

color:
  palette:
    # Primary color (Hausfarbe)
    blau: "#39569F"  # CMYK 100/70/0/0 | RAL 5005 Signalblau | HKS 39
    
    # Secondary colors (Sekundärfarben/Schmuckfarben)
    grau: "#A1B3B3"        # CMYK 10/0/0/30
    rot: "#CC0000"         # CMYK 0/100/100/20 | Präsenz-Bachelor
    orange: "#FF8000"      # CMYK 0/50/100/0 | Präsenz-Master
    tuerkis: "#009FB3"     # CMYK 100/10/30/0 | Verbund-Bachelor
    gruen: "#99CC00"       # CMYK 40/0/100/0 | Verbund-Master
    pink: "#BF0088"        # CMYK 25/100/15/0
    wasserblau: "#0077BF"  # CMYK 100/30/0/0
    
    # Semantic color names for consistency with Bootstrap
    blue: blau
    red: rot
    green: gruen
    cyan: tuerkis
    teal: tuerkis
    yellow: orange
    magenta: pink
    gray: grau
    gray-dark: "#728383"  # Grau +60% K (shade scale base)
  
  # Semantic mappings
  primary: blau
  secondary: grau
  success: gruen      # Verbund-Master
  info: wasserblau    # General water blue
  warning: orange     # Präsenz-Master
  danger: rot         # Präsenz-Bachelor
  
  # Background and text
  foreground: "#333333"  # Dark gray for text
  background: "#ffffff"  # White background
  
  # UI colors
  light: "#f8f9fa"       # Light gray background for UI elements
  dark: "#343a40"        # Dark gray for UI elements

typography:
  fonts:
    # Sans-serif for UI and body text
    - family: Lato
      source: google
      weight: [300, 400, 500, 600, 700]  # Light, Regular, Medium, Semibold, Bold
      style: [normal, italic]
    
    # Serif for long-form reading (academic texts)
    - family: "Source Serif 4"
      source: google
      weight: [400, 600, 700]  # Regular, Semibold, Bold
      style: [normal, italic]
    
    # Monospace for code and technical content
    - family: "JetBrains Mono"
      source: google
      weight: [400, 600]  # Regular, Semibold
      style: [normal, italic]
  
  # Text elements
  base:
    family: Lato
    size: 16px
    line-height: 1.5
    weight: 400
  
  headings:
    family: Lato
    weight: 600  # Semibold for headings
    color: primary
  
  links:
    color: primary
    decoration: underline
  
  monospace:
    family: "JetBrains Mono"
  
  monospace-inline:
    background-color: light
    padding: 0.1em 0.3em
    border-radius: 3px
  
  monospace-block:
    background-color: "#f5f5f5"
    padding: 1em

logo:
  images:
    wort-bildmarke-color: assets/logos/fhswf-logo.svg
    wort-bildmarke-white: assets/logos/fhswf-logo-white.svg
    wort-bildmarke-bw: assets/logos/fhswf-logo-bw.svg
    bildmarke-color: assets/logos/fhswf-icon.svg
    bildmarke-white: assets/logos/fhswf-icon-white.svg
  
  small: bildmarke-color
  medium:
    light: wort-bildmarke-color
    dark: wort-bildmarke-white
  large: wort-bildmarke-color

meta:
  name: "Fachhochschule Südwestfalen"
  subtitle: "University of Applied Sciences"
  link: "https://www.fh-swf.de/"
  claim: "Wir geben Impulse"  # German-only claim

defaults:
  bootstrap:
    defaults: |
      $enable-rounded: true;
      $border-radius: 9px;  # CD guideline: 9mm at A4, ratio 1:3
      $border-radius-lg: 12px;
      $border-radius-sm: 6px;
    rules: |
      /* Use German quotation marks */
      blockquote::before {
        content: '»';
      }
      blockquote::after {
        content: '«';
      }